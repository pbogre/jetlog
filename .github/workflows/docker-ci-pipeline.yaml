name: Docker Build and Push

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install pipenv
          pipenv install --system --deploy
          python -m pip install -r requirements-dev.txt

      - name: Run backend tests
        run: pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend checks
        run: |
          npm run typecheck
          npm test
          npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Process version tag
        if: github.event_name == 'release'
        id: version
        run: |
          CLEAN_VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Set PR tag
        if: github.event_name == 'pull_request'
        id: pr_tag
        run: |
          echo "pr_tag=pr-${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ github.repository_owner }}/jetlog
          tags: |
            ${{ steps.pr_tag.outputs.pr_tag || '' }}
            ${{ github.event_name == 'push' && 'experimental' || '' }}
            ${{ github.event_name == 'release' && 'latest' || '' }}
            ${{ github.event_name == 'release' && steps.version.outputs.version || '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
